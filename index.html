<!DOCTYPE html>
<html lang="pt-BR">
<head>

    }

    .emoji{

    .btn{

      background:#ec407a;
      color:white;
      text-decoration:none;
      border-radius:16px;
      font-size:18px;

<body>

<div class="card">
