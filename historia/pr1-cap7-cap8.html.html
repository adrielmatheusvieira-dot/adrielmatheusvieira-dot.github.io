<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR1 História</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(#fff1f2,#f8fafc);color:#1f2937}.wrap{max-width:780px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#be123c,#7c3aed);color:#fff;padding:24px;border-radius:24px;margin-bottom:18px}.hero h1{margin:0 0 8px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.hidden{display:none}.center{text-align:center}.btn{width:100%;border:0;border-radius:14px;background:#111827;color:#fff;padding:15px;font-size:17px;font-weight:800}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{background:#fff1f2;color:#be123c;border-radius:999px;padding:7px 10px;font-weight:800}.progress{height:10px;background:#f1f5f9;border-radius:999px;overflow:hidden;margin:14px 0 20px}.progress div{height:100%;background:linear-gradient(90deg,#be123c,#7c3aed)}h2{font-size:24px}.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid #e5e7eb;background:#fff;font-size:17px}.correct{border-color:#22c55e!important;background:#f0fdf4!important}.wrong{border-color:#ef4444!important;background:#fef2f2!important}.feedback{display:none;margin-top:16px;padding:14px;border-radius:14px}.feedback.ok{display:block;background:#f0fdf4;color:#166534}.feedback.bad{display:block;background:#fef2f2;color:#991b1b}.next{display:none;margin-top:16px}.score{font-size:58px;font-weight:900}.small{color:#6b7280;font-size:14px}
</style></head><body><div class="wrap">
<section class="hero"><h1>🏺 Missão História</h1><p>PR1 — Capítulos 7 e 8</p></section>
<section class="card" id="start"><div class="center"><h2>Vamos revisar? 📚</h2><p>25 perguntas por rodada, em ordem aleatória.</p><button class="btn" onclick="startGame()">Começar</button></div></section>
<section class="card hidden" id="game"><div class="top"><span class="badge" id="counter"></span><span class="badge" id="scoreBadge"></span></div><div class="progress"><div id="bar"></div></div><h2 id="q"></h2><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button class="btn next" id="next" onclick="nextQ()">Próxima</button></section>
<section class="card hidden" id="end"><div class="center"><h2>Fim da rodada! 🎉</h2><div class="score" id="final"></div><p id="msg"></p><p class="small">Se errar alguma, leia a explicação e jogue novamente.</p><button class="btn" onclick="startGame()">Jogar novamente</button></div></section>
</div><script>
const bank=[{"q": "O que é uma fonte histórica?", "a": ["Algo produzido pela ação humana que ajuda a compreender o passado", "Apenas um livro antigo", "Somente um documento oficial", "Qualquer objeto novo"], "c": 0, "e": "Fontes históricas são vestígios produzidos pela ação humana que ajudam a compreender o passado."}, {"q": "Qual destes é um documento oficial?", "a": ["Certidão de nascimento", "Brinquedo antigo", "Fotografia de família", "Máquina de costura"], "c": 0, "e": "Certidões, carteiras de identidade, passaportes e outros registros são documentos oficiais."}, {"q": "O que um passaporte pode mostrar sobre a história de uma pessoa?", "a": ["Países visitados", "Somente sua idade", "Apenas sua profissão", "O nome dos vizinhos"], "c": 0, "e": "Passaportes podem registrar países visitados e outros dados de viagem."}, {"q": "O que uma carteira de trabalho pode informar?", "a": ["Tipo de trabalho e tempo trabalhado", "Somente o endereço da pessoa", "Apenas viagens realizadas", "O nome de todos os familiares"], "c": 0, "e": "A carteira de trabalho registra informações sobre empregos e atividades profissionais."}, {"q": "A fotografia chegou ao Brasil por volta de...", "a": ["1840", "1940", "1740", "2000"], "c": 0, "e": "A apostila informa que a fotografia chegou ao Brasil por volta de 1840."}, {"q": "O que é uma fotopintura?", "a": ["Uma fotografia trabalhada com técnicas de pintura", "Uma fotografia digital", "Um documento oficial", "Uma escultura"], "c": 0, "e": "A fotopintura mistura fotografia e pintura."}, {"q": "Como as fotografias de família ajudam no estudo do passado?", "a": ["Mostrando pessoas, momentos, roupas e costumes de uma época", "Reproduzindo exatamente tudo o que aconteceu", "Substituindo todas as outras fontes", "Mostrando apenas nomes e datas"], "c": 0, "e": "Fotografias registram aspectos de momentos vividos e podem revelar costumes e mudanças."}, {"q": "A fotografia é uma reprodução totalmente exata do passado?", "a": ["Não, ela é uma construção sobre o passado", "Sim, sempre mostra tudo exatamente como aconteceu", "Sim, porque toda foto é espontânea", "Não, porque fotos não podem ser fontes históricas"], "c": 0, "e": "A apostila destaca que a fotografia é uma construção sobre o passado."}, {"q": "Qual destes pode preservar memórias de uma família?", "a": ["Uma máquina de costura antiga", "Somente documentos oficiais", "Apenas objetos caros", "Somente fotografias digitais"], "c": 0, "e": "Objetos antigos podem carregar lembranças e histórias de gerações."}, {"q": "Quem investiga e interpreta fontes históricas para compreender o passado?", "a": ["Historiador", "Motorista", "Arquiteto", "Médico"], "c": 0, "e": "O historiador investiga e interpreta vestígios do passado."}, {"q": "O que são vestígios arqueológicos?", "a": ["Fragmentos ou objetos antigos encontrados e estudados", "Somente moedas de ouro", "Apenas fósseis de dinossauros", "Objetos novos perdidos no chão"], "c": 0, "e": "Vestígios arqueológicos são restos e fragmentos de objetos, construções e materiais de pessoas do passado."}, {"q": "Quem faz escavações e pesquisa vestígios arqueológicos?", "a": ["Arqueólogo", "Fotógrafo", "Carteiro", "Engenheiro de trânsito"], "c": 0, "e": "O arqueólogo pesquisa vestígios do passado, muitas vezes por meio de escavações."}, {"q": "Qual destes pode ser um vestígio arqueológico?", "a": ["Cacos de louça", "Uma nuvem", "Uma placa de trânsito recém-instalada", "Um celular novo em uso"], "c": 0, "e": "Cacos de louça, moedas, ossadas, ruínas e cerâmicas podem ser achados arqueológicos."}, {"q": "Por que arqueólogos comparam vários pedaços encontrados?", "a": ["Para tentar reconstruir objetos e compreender o passado", "Para jogar fora os menores", "Para escolher apenas os mais bonitos", "Para descobrir qual vale mais dinheiro"], "c": 0, "e": "Os vestígios são comparados como peças de um quebra-cabeça."}, {"q": "O que significa levantar uma hipótese?", "a": ["Propor uma explicação possível, ainda não comprovada", "Dar uma certeza absoluta", "Inventar uma história sem observar evidências", "Copiar uma resposta pronta"], "c": 0, "e": "Hipótese é uma explicação possível que ainda precisa ser comprovada."}, {"q": "Os vestígios arqueológicos também são...", "a": ["Fontes históricas", "Somente objetos de museu sem informação", "Brinquedos atuais", "Documentos oficiais"], "c": 0, "e": "Eles fornecem informações sobre hábitos e costumes das pessoas do passado."}, {"q": "Costumes e tradições de uma comunidade podem ser estudados como...", "a": ["Fontes históricas", "Apenas diversão", "Somente regras escolares", "Objetos sem importância"], "c": 0, "e": "Costumes e tradições ajudam a compreender a cultura e a história de uma comunidade."}, {"q": "Na apostila, a produção tradicional de tapioca começa com o cultivo de...", "a": ["Mandioca", "Arroz", "Trigo", "Milho"], "c": 0, "e": "O exemplo apresentado mostra o cultivo e preparo da mandioca até chegar à tapioca."}, {"q": "No exemplo da tapioca, o preparo tradicional era realizado principalmente...", "a": ["Manualmente", "Apenas por robôs", "Somente em fábricas modernas", "Por computadores"], "c": 0, "e": "A sequência mostra um processo tradicional realizado manualmente."}, {"q": "Para que servem museus comunitários?", "a": ["Para preservar memórias, cultura e saberes locais", "Para vender objetos antigos", "Para esconder tradições", "Somente para guardar documentos oficiais"], "c": 0, "e": "Museus comunitários valorizam e preservam memórias e saberes das comunidades."}, {"q": "O nome das ruas pode ser considerado uma fonte histórica?", "a": ["Sim", "Não", "Somente quando a rua é muito antiga", "Somente em capitais"], "c": 0, "e": "Os nomes das ruas podem revelar características, homenagens e acontecimentos históricos."}, {"q": "A Rua da Ladeira recebeu esse nome por causa de...", "a": ["Uma característica do lugar", "Uma comida tradicional", "Uma profissão", "Um objeto arqueológico"], "c": 0, "e": "O nome está relacionado à característica física da localidade."}, {"q": "A Rua Boa Vista ficou conhecida assim porque...", "a": ["Oferecia uma bela vista da paisagem", "Era a rua mais curta", "Tinha muitas lojas", "Era perto de um museu"], "c": 0, "e": "O nome se relacionava à bela vista que se tinha do local."}, {"q": "A arqueologia urbana acontece...", "a": ["Nas cidades", "Somente em florestas", "Apenas em desertos", "Somente no campo"], "c": 0, "e": "A arqueologia urbana investiga vestígios do passado encontrados em áreas de cidades."}, {"q": "Qual expressão melhor resume o Capítulo 8?", "a": ["Objetos, costumes e lugares ajudam a contar a história da comunidade", "Somente documentos oficiais contam a história", "A história da comunidade não muda", "Apenas museus podem explicar o passado"], "c": 0, "e": "Vestígios, tradições, museus e nomes de ruas ajudam a compreender a comunidade."}];let game=[],i=0,score=0,locked=false;
function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('game').classList.remove('hidden');game=sh(bank).slice(0,25);i=0;score=0;show()}
function show(){locked=false;let it=game[i];counter.textContent=`Pergunta ${i+1} de ${game.length}`;scoreBadge.textContent=`⭐ ${score} pontos`;bar.style.width=`${i/game.length*100}%`;q.textContent=it.q;answers.innerHTML='';sh(it.a.map((t,x)=>({t,x}))).forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o.t;b.onclick=()=>choose(o.x,b);answers.appendChild(b)});fb.className='feedback';fb.textContent='';next.style.display='none'}
function choose(x,b){if(locked)return;locked=true;let it=game[i],bs=[...document.querySelectorAll('.answer')];bs.forEach(z=>z.disabled=true);if(x===it.c){score++;b.classList.add('correct');fb.className='feedback ok';fb.innerHTML=`✅ <b>Acertou!</b> ${it.e}`}else{b.classList.add('wrong');let c=it.a[it.c];bs.forEach(z=>{if(z.textContent===c)z.classList.add('correct')});fb.className='feedback bad';fb.innerHTML=`❌ <b>Quase!</b> A correta é <b>${c}</b>. ${it.e}`}scoreBadge.textContent=`⭐ ${score} pontos`;next.style.display='block'}
function nextQ(){i++;if(i>=game.length)finish();else show()}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');final.textContent=`${score}/${game.length}`;let p=score/game.length;msg.textContent=p===1?'Perfeito! 🌟':p>=.88?'Excelente! 👏':p>=.72?'Muito bom! 📚':'Vale revisar mais um pouco e tentar novamente. 💪'}
</script></body></html>
